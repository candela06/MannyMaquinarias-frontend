<div class="container mt-4">
  <h2 class="mb-4">Historial de Reservas</h2>

  <div *ngIf="cargando" class="alert alert-info">Cargando tus reservas...</div>

  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <div *ngIf="!cargando && reservas.length === 0" class="alert alert-warning">
    No tenés reservas registradas.
  </div>

  <div class="table-responsive" *ngIf="reservas.length > 0">
    <table class="table table-striped table-bordered shadow-sm rounded">
      <thead class="table-dark">
        <tr>
          <th>Máquina</th>
          <th>Precio</th>
          <th>Inicio</th>
          <th>Fin</th>
          <th>Fecha de Reserva</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of reservas">
          <td>{{ r.maquina.nombre }}</td>
          <td>${{ r.precio }}</td>
          <td>{{ r.fecha_inicio | date : "dd/MM/yyyy" }}</td>
          <td>{{ r.fecha_fin | date : "dd/MM/yyyy" }}</td>
          <td>{{ r.fecha_reserva | date : "dd/MM/yyyy" }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
