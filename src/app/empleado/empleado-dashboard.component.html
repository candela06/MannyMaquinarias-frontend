<div class="container py-4">
  <h2 class="text-center mb-5 text-orange fw-bold">Panel de gestión</h2>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    <div class="col" *ngFor="let option of employeeOptions">
      <div class="card h-100 shadow-sm border-0 rounded-4 admin-option-card">
        <div
          class="card-body d-flex flex-column align-items-center justify-content-center text-center p-4"
        >
          <i
            class="bi {{ option.icon }} text-orange mb-3"
            style="font-size: 3rem"
          ></i>
          <h5 class="card-title fw-bold text-dark">{{ option.title }}</h5>
          <p class="card-text text-muted">{{ option.description }}</p>
          <button
            *ngIf="option.accionLocal"
            (click)="logClick(option)"
            class="btn btn-outline-orange mt-auto"
          >
            Ir a {{ option.title }}
          </button>

          <a
            *ngIf="!option.accionLocal"
            [routerLink]="option.route"
            class="btn btn-outline-orange mt-auto stretched-link"
          >
            Ir a {{ option.title }}
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<div
  *ngIf="mostrarFormularioCliente"
  class="card shadow-sm p-4 mb-4 formulario-centrado"
>
  <h4 class="mb-3">Nuevo Cliente ✨</h4>
  <form #formEmpleado="ngForm" (ngSubmit)="crearCliente()">
    <div class="mb-3">
      <label for="email" class="form-label">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        class="form-control"
        [(ngModel)]="nuevoCliente.email"
        required
      />
    </div>

    <div class="mb-3">
      <label for="edad" class="form-label">Fecha de nacimiento:</label>
      <input
        type="date"
        id="edad"
        name="edad"
        class="form-control"
        [(ngModel)]="nuevoCliente.edad"
        required
        (change)="validarEdad()"
        [max]="hoy"
      />
      <div *ngIf="edadValida === false" class="text-danger mt-1">
        El empleado debe tener al menos 18 años.
      </div>
    </div>

    <button
      type="submit"
      class="btn btn-outline-success"
      [disabled]="formEmpleado.invalid || edadValida === false"
    >
      Crear Cliente
    </button>
  </form>
</div>

<!-- saldar deuda -->
<!-- MODAL BACKDROP para SALDAR DEUDA con Bootstrap -->
<!-- MODAL BACKDROP elegante -->
<div
  class="modal fade show d-block"
  tabindex="-1"
  style="background-color: rgba(0, 0, 0, 0.6)"
  *ngIf="mostrarFormularioSaldar"
  (click)="cerrarModal($event)"
>
  <div
    class="modal-dialog modal-dialog-centered"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-content rounded-4 shadow-lg border-0">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-semibold fs-4">Saldar deuda de un cliente</h5>
        <button
          type="button"
          class="btn-close"
          aria-label="Cerrar"
          (click)="cerrarModal($event)"
        ></button>
      </div>

      <div class="modal-body pt-0">
        <div class="mb-4">
          <label for="emailCliente" class="form-label fw-medium"
            >Email del cliente</label
          >
          <input
            type="email"
            id="emailCliente"
            class="form-control form-control-lg rounded-3 shadow-sm"
            [(ngModel)]="emailCliente"
            placeholder="cliente@correo.com"
            (keyup.enter)="buscarMonto()"
          />
        </div>

        <div class="d-grid mb-4">
          <button
            class="btn btn-dark btn-lg rounded-3"
            (click)="buscarMonto()"
            [disabled]="cargandoMonto"
          >
            Buscar monto
          </button>
        </div>

        <div *ngIf="cargandoMonto" class="text-center text-muted mb-3">
          <div
            class="spinner-border spinner-border-sm me-2"
            role="status"
          ></div>
          Buscando monto...
        </div>

        <div *ngIf="errorMonto" class="alert alert-danger rounded-3 py-2 px-3">
          {{ errorMonto }}
        </div>

        <div
          *ngIf="montoActual !== null"
          class="alert alert-light border text-center fs-5 rounded-3"
        >
          Monto actual:
          <span class="fw-bold text-danger">${{ montoActual }}</span>
        </div>
      </div>

      <div class="modal-footer border-0 pt-0">
        <button
          *ngIf="montoActual !== null"
          class="btn btn-success btn-lg rounded-3"
          (click)="resetearMonto()"
        >
          Saldar deuda
        </button>
        <button
          class="btn btn-outline-secondary btn-lg rounded-3"
          (click)="cerrarModal($event)"
        >
          Cancelar
        </button>
      </div>
    </div>
  </div>
</div>

  .modal-contenido {
