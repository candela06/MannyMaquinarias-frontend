<div class="container py-4">
  <h2 class="text-center mb-5 text-orange fw-bold">Panel de gestión</h2>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    <div class="col" *ngFor="let option of employeeOptions">
      <div class="card h-100 shadow-sm border-0 rounded-4 admin-option-card">
        <div
          class="card-body d-flex flex-column align-items-center justify-content-center text-center p-4"
        >
          <i
            class="bi {{ option.icon }} text-orange mb-3"
            style="font-size: 3rem"
          ></i>
          <h5 class="card-title fw-bold text-dark">{{ option.title }}</h5>
          <p class="card-text text-muted">{{ option.description }}</p>
          <button
            *ngIf="option.accionLocal"
            (click)="logClick(option)"
            class="btn btn-outline-orange mt-auto"
          >
            Ir a {{ option.title }}
          </button>

          <a
            *ngIf="!option.accionLocal"
            [routerLink]="option.route"
            class="btn btn-outline-orange mt-auto stretched-link"
          >
            Ir a {{ option.title }}
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<div
  *ngIf="mostrarFormularioCliente"
  class="card shadow-sm p-4 mb-4 formulario-centrado"
>
  <h4 class="mb-3">Nuevo Cliente ✨</h4>
  <form #formEmpleado="ngForm" (ngSubmit)="crearCliente()">
    <div class="mb-3">
      <label for="email" class="form-label">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        class="form-control"
        [(ngModel)]="nuevoCliente.email"
        required
      />
    </div>

    <div class="mb-3">
      <label for="edad" class="form-label">Fecha de nacimiento:</label>
      <input
        type="date"
        id="edad"
        name="edad"
        class="form-control"
        [(ngModel)]="nuevoCliente.edad"
        required
        (change)="validarEdad()"
        [max]="hoy"
      />
      <div *ngIf="edadValida === false" class="text-danger mt-1">
        El empleado debe tener al menos 18 años.
      </div>
    </div>

    <button
      type="submit"
      class="btn btn-outline-success"
      [disabled]="formEmpleado.invalid || edadValida === false"
    >
      Crear Cliente
    </button>
  </form>
</div>

<style>
  /* src/app/admin/admin-dashboard/admin-dashboard.component.css */

  .admin-option-card {
    transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
  }

  .admin-option-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
  }

  .text-orange {
    color: #e08e00;
    /* Tu color naranja */
  }

  .btn-outline-orange {
    color: #ff5722;
    border-color: #ff5722;
  }

  .btn-outline-orange:hover {
    background-color: #e08e00;
    color: white;
    border-color: #e08e00;
  }
</style>
