<!-- src/app/usuario/reservas/pago/failure.component.html -->
<div class="container text-center mt-5">
  <h1 class="text-danger">❌ Pago fallido</h1>
  <p class="lead">
    Hubo un problema al procesar tu pago. Por favor, intentá nuevamente o elegí otro método.
  </p>

  <div class="mt-4">
    <button class="btn btn-secondary me-3" (click)="volverCatalogo()">
      Volver al catálogo
    </button>
    <button class="btn btn-outline-dark" (click)="volverInicio()">
      Ir al inicio
    </button>
  </div>
</div>
