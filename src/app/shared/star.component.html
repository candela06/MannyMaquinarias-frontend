<div class="star-rating" [class.readonly]="readonly">
  <span
    *ngFor="let star of stars"
    class="star"
    [class.filled]="isStarFilled(star)"
    (click)="selectRating(star)"
    (mouseover)="onMouseOver(star)"
    (mouseleave)="onMouseLeave()"
    [attr.aria-label]="star + ' estrellas'"
    role="button"
    [attr.tabindex]="readonly ? null : 0"
    (keydown.enter)="selectRating(star)"
    (keydown.space)="selectRating(star)"
  >
    &#9733;
  </span>
</div>
<style>
  .star-rating {
    display: inline-flex;
    gap: 5px;
  }

  .star {
    font-size: 2.5em;
    color: #ccc;
    cursor: pointer;
    transition: color 0.2s ease-in-out;
    line-height: 1;
    outline: none;
  }

  .star.filled {
    color: gold;
  }

  .star:hover {
    color: orange;
  }

  .star-rating.readonly .star {
    cursor: default;
  }
</style>
