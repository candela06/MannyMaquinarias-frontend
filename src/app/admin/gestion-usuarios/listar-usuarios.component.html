<div class="container mt-4">
  <div *ngIf="isLoading" class="alert alert-info">Cargando usuarios...</div>

  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <div class="container mt-5">
    <h2 class="mb-4">Listado de Usuarios</h2>
    <button class="btn btn-secondary mb-4 me-2" routerLink="/admin-dashboard">
      Volver
    </button>
    <button
      routerLink="/admin/usuarios/lista-negra"
      class="btn btn-dark mb-4 me-2"
    >
      Ver Lista Negra
    </button>
    <button
      routerLink="/admin/usuarios/asignar-rol"
      class="btn btn-primary mb-4 me-2"
    >
      Crear Usuario Empleado
    </button>

    <div class="table-responsive">
      <table class="table table-striped table-bordered shadow-sm rounded">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>DNI</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Email</th>
            <th>Dirección</th>
            <th>Edad</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let usuario of usuarios">
            <td>{{ usuario.id }}</td>
            <td>{{ usuario.dni }}</td>
            <td>{{ usuario.nombre }}</td>
            <td>{{ usuario.apellido }}</td>
            <td>{{ usuario.email }}</td>
            <td>{{ usuario.direccion }}</td>
            <td>{{ usuario.edad }}</td>
            <td>
              <button
                class="btn btn-danger btn-sm"
                (click)="eliminarUsuario(usuario.email)"
              >
                Eliminar
              </button>
              <button
                class="btn btn-warning btn-sm"
                (click)="agregarListaNegra(usuario.email)"
              >
                Lista Negra
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div *ngIf="!usuarios.length && !isLoading" class="alert alert-warning">
    No hay usuarios registrados.
  </div>
</div>
